  /v1/solana/delegators:
    post:
      tags:
      - Solana
      summary: Retrieve Multiple Delegators
      description: The endpoint to retrieve a list of delegators returns the details of the stake accounts monitored by a given client that fit the specified filter criteria in a paginated manner. If no filtration criteria is provided, the endpoint will retrieve a list of all the stake accounts applicable to the client. All timestamp fields in the response are in UTC.
      operationId: getMultipleDelegators
      parameters:
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: The current page number requested by the client, if not specified, should be defaulted to 1.
        required: false
        schema:
          type: string
          default: '1'
      - name: size
        in: query
        description: The number of entries per page, if not presented in the request, should be defaulted to the maximum value of 250.
        required: false
        schema:
          type: string
          default: '250'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegatorInfoListRequest'
        required: true
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatorInfoListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternalServerErrorMessage'
  /v1/solana/{network}/delegators/{stake_account}:
    get:
      tags:
      - Solana
      summary: Get a Single Delegator
      description: This request will return the information regarding a single delegator which is being monitored by the staking partner
      operationId: getSingleDelegator
      parameters:
      - name: X-API-KEY
        in: header
