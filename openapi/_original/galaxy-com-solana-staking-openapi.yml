  /v1/solana/delegators/monitoring:
    post:
      tags:
      - Solana
      summary: Delegator Monitoring
      description: Clients can invoke this endpoint to monitor existing delegations by retrieving and tracking delegator addresses (stake accounts) on the staking platform. A request with a list of delegator addresses enables the creation of corresponding positions on the staking platform for monitoring purposes.
      operationId: createValidatorMonitoringUpdate
      parameters:
      - name: X-API-KEY
        in: header
        required: true
        schema:
