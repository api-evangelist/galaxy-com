  /v1/solana/delegators/merge:
    post:
      summary: Merge
      description: The Staking API offers an endpoint to merge two stake accounts that share the same stake and withdrawal authorities into a single stake account. This endpoint allows clients to merge stake accounts that are currently onboarded onto the staking platform as well as merge stake accounts that do not have a corresponding position on the staking platform.
      tags:
      - Solana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source_account_pubkey
              - destination_account_pubkey
              properties:
                source_account_pubkey:
                  type: string
                  description: The stake account that should be merged into the destination account.
                destination_account_pubkey:
                  type: string
                  description: The stake account that the source account will be merged into.
                fee_payer:
                  type: string
                  description: The Solana account address that should pay the fees related to the transaction. If not provided fees should be paid by the Stake Authority of the stake account.
                participant:
                  type: string
                  description: The participant name registered on the staking platform under which the stake account should be created if it has not currently been onboarded onto the staking platform. If not provided the position/s will be created under a default participant.
                account:
                  type: string
                  description: The account name registered on the staking platform under which the stake account should be created if it has not currently been onboarded onto the staking platform. If not provided the position/s will be created under a default account.
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_account_pubkey:
                    type: string
                    description: The source stake account that was sent in the merge request.
                  destination_account_pubkey:
                    type: string
                    description: The destination stake account that was sent in the merge request.
                  unsigned_tx:
                    type: string
                    description: The Hexadecimal encoded serialized unsigned transaction which should be signed by the relevant parties specified in the signers field.
                  signers:
                    type: array
                    description: An array of the Solana account addresses that should sign the transaction. A merge request should be signed by the Stake Authority of the stake account and the "fee_payer" (If applicable).
                    items:
                      type: string
                  created_at:
                    type: string
                    format: date-time
                    description: The time at which the request was received by the staking platform. Times will be shown in the "YYYY-MM-DD HH:mm:ss" format.
