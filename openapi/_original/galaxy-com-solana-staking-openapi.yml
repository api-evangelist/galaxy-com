                      $ref: '#/components/schemas/InternalServerErrorMessage'
components:
  securitySchemes:
    AuthorizationToken:
      type: http
      description: ''
      scheme: bearer
      bearerFormat: JWT
    APIKey:
      name: X-API-KEY
      type: apiKey
      in: header
  schemas:
    ErrorMessage:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    InternalServerErrorMessage:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    SOLDelegatorRewardsRequest:
      type: object
      required:
      - network
      - rollup_type
      - start
      - end
      - stake_accounts
      properties:
        network:
          type: string
          description: "The network on which validators should be created. Supported values;\r\n- mainnet\r\n- testnet\r\n- devnet"
          enum:
          - mainnet
          - testnet
          - devnet
        rollup_type:
          type: integer
          description: 'Denotes the granularity of rewards breakdown. THe applicable values are;

            - 1 (epoch)

            - 2 (date)'
          enum:
          - 1
          - 2
        start:
          type: string
          description: It specifies the start epoch if the type is 1, or the start date in the "YYYY-MM-DD" format (UTC timezone) if the type is 2.
        end:
          type: string
          description: It specifies the end epoch if the type is 1, or the end date in the "YYYY-MM-DD" format (UTC timezone) if the type is 2.
        stake_accounts:
          type: array
          description: List of delegator stake accounts to fetch the rewards breakdown. A maximum of 50 entries are allowed.
          items:
            type: string
            description: List of delegator stake accounts to fetch the rewards breakdown. A maximum of 50 entries are allowed.
    DelegatorRewardsInfoResponse:
      type: object
      properties:
        network:
          type: string
          description: Network specified in the request.
          enum:
          - mainnet
          - testnet
          - devnet
        start:
          type: string
          description: Start epoch or start date specified in the request.
        end:
          type: string
          description: End epoch or end date specified in the request.
        page:
          type: integer
          description: The current page number sent in the request.
          format: int32
        total:
          type: integer
          description: The total number of records resulted for the input criteria.
          format: int64
        data:
          type: array
          description: An array that contains stake account rewards.
          items:
            $ref: '#/components/schemas/DelegatorReward'
      title: ''
    DelegatorReward:
      type: object
      properties:
        stake_account:
          type: string
          description: The stake_account that received the rewards.
        validator_address:
          type: string
          description: Address of the validator that distributed the rewards (the validator the delegator is attached to).
        total_sol:
          type: number
          format: double
          description: 'Total rewards the delegator earned from inception in SOL. Values will be displayed up to 9 decimal places


            Note: Block rewards will not be available from delegator inception, therefore this field will not consider block rewards. Only inflation rewards and MEV rewards will be considered.

            '
        total_lamports:
          type: integer
          description: 'Total rewards the delegator earned from inception in lamports.


            Note : Similar to "total_sol" this field will not consider block rewards

            '
        apy:
          type: number
          format: double
          description: The Annualized Percentage Yield of the stake account. This value is calculated considering net inflation and net MEV rewards earned during the last 10 completed epochs.
        block_rewards_apy:
          type: number
          format: double
          description: The Annualized Percentage Yield on block rewards earned by the stake account. This value is calculated considering net block rewards earned during the last 10 completed epochs.
        total_apy:
          type: number
          format: double
          description: The total Annualized Percentage Yield on all rewards attributable to the stake account in the last 10 epochs, after commissions and rebates.
        total_accumulated_sol:
          type: number
          format: double
          description: 'Total rewards the delegator has earned for the query criteria in SOL. Values will be displayed up to 9 decimal places


            Update: Reflects the sum of MEV and inflation rewards only. Block rewards are excluded from this calculation.

            '
        total_accumulated_lamports:
          type: integer
          description: 'Total rewards the delegator has earned for the query criteria in lamports.


            Update: Reflects the sum of MEV and inflation rewards only. Block rewards are excluded from this calculation.

            '
        accumulated_gross_block_rewards_sol:
          type: number
          format: double
          description: 'The total gross block rewards earned by the stake account for the query criteria in SOL.


            Note: If the query covers epochs/dates prior to implementation of the block rewards calculation, block rewards will not be considered.

            '
        accumulated_gross_block_rewards_lamports:
          type: integer
          description: 'The total gross block rewards earned by the stake account for the query criteria in lamports.


            Note: If the query covers epochs/dates prior to implementation of the block rewards calculation, block rewards will not be considered.

            '
        accumulated_net_block_rewards_sol:
          type: number
          format: double
          description: 'The net block rewards earned by the stake account for the query criteria in SOL, net of the staking platform commissions.


            Note: If the query covers epochs/dates prior to implementation of the block rewards calculation, block rewards will not be considered.

            '
        accumulated_net_block_rewards_lamports:
          type: integer
          description: 'The net block rewards earned by the stake account for the query criteria in lamports, net of the staking platform commissions.


            Note: If the query covers epochs/dates prior to implementation of the block rewards calculation, block rewards will not be considered.

            '
        accumulated_rewards:
          type: array
          description: 'Protocol, MEV, and block rewards for the given delegator and query criteria. A new rewards type "NET_BLOCK" has been introduced.


            Note: If the query covers epochs/dates prior to implementation of the block rewards calculation, block rewards will be set to 0.

            '
          items:
            $ref: '#/components/schemas/AccumulatedReward'
        rewards_breakdown:
          type: array
          description: Per-epoch (or period) rewards breakdown.
          items:
            $ref: '#/components/schemas/RewardBreakdown'
      required:
      - stake_account
      - validator_address
    AccumulatedReward:
      type: object
      properties:
        accumulated_sol:
          type: number
          format: double
          description: 'Accumulated rewards in SOL between the start and end specified in the request. Values will be displayed up to 9 decimal places


            When "type" = "NET_BLOCK", net block rewards will be returned.

            '
        accumulated_lamports:
          type: integer
          description: 'Accumulated rewards in lamports between the start and end specified in the request.


            When "type" = "NET_BLOCK", net block rewards will be returned.

            '
        type:
          type: string
          description: Type of rewards.
          enum:
          - PROTOCOL
          - MEV
          - BLOCK
          - NET_BLOCK
    RewardBreakdown:
      type: object
      description: Rewards for a given epoch/period.
      properties:
        epoch:
          type: integer
          description: The epoch corresponding to the rewards. This is applicable only if the rollup_type is 1
        timestamp:
          type: string
          format: date-time
          description: If the rollup_type is 1, it should specify the timestamp corresponding to the end of the epoch.
        balance:
          type: number
          format: double
          description: The balance of the account after rewards have been added.
        total_epoch_sol:
          type: number
          format: double
          description: 'Total rewards accumulated during the period in SOL. Values will be displayed up to 9 decimal places


            Update: Reflects the sum of MEV and inflation rewards only. Block rewards are excluded from this calculation.

            '
        total_epoch_lamports:
          type: integer
          description: 'Total rewards accumulated during the period in lamports.


            Update: Reflects the sum of MEV and inflation rewards only. Block rewards are excluded from this calculation.

            '
        total_epoch_gross_block_rewards_sol:
          type: number
          format: double
          description: The gross block rewards earned by the stake account for the epoch, in SOL.
        total_epoch_gross_block_rewards_lamports:
          type: integer
          description: The gross block rewards earned by the stake account for the epoch, in lamports.
        total_epoch_net_block_rewards_sol:
          type: number
          format: double
          description: The net block rewards earned by the stake account for the epoch, in SOL, net of the staking platform commissions.
        total_epoch_net_block_rewards_lamports:
          type: integer
          description: The net block rewards earned by the stake account for the epoch, in lamports, net of the staking platform commissions.
        rewards:
          type: array
          description: An array that contains protocol, mev, and block rewards corresponding to the given epoch. A new rewards type "NET_BLOCK" has been introduced.
          items:
            $ref: '#/components/schemas/RewardItem'
      required:
      - rewards
    RewardItem:
      type: object
      properties:
        rewards_sol:
          type: number
          format: double
          description: 'Rewards accumulated during the period in SOL. Values will be displayed up to 9 decimal places


            When "type" = "NET_BLOCK", net block rewards will be returned.

            '
        rewards_lamports:
          type: integer
          description: 'Rewards accumulated during the period in lamports.


            When "type" = "NET_BLOCK", net block rewards will be returned.

            '
        type:
          type: string
          description: Type of rewards.
          enum:
          - PROTOCOL
          - MEV
          - BLOCK
          - NET_BLOCK
    DelegatorInfoListRequest:
      type: object
      required:
      - network
      properties:
        network:
          type: string
          description: "The network on which the queried stake accounts have been created . Supported values;\r\n- mainnet\r\n- testnet\r\n- devnet"
          enum:
          - mainnet
          - testnet
          - devnet
        participant:
          type: string
          description: The participant name registered on the staking platform from which stake accounts need to be retrieved.
        account:
          type: string
          description: The account name registered on the staking platform from which stake accounts need to be retrieved.
        status:
          type: array
          description: "The status of the stake accounts that need to be retrieved. Results will be returned in the order of the statuses sent in the request. Supported values;\r\n- ACTIVE\r\n- INACTIVE\r\n- ACTIVATING\r\n- DEACTIVATING"
          items:
            type: string
            enum:
            - ACTIVE
            - INACTIVE
            - ACTIVATING
            - DEACTIVATING
        stake_accounts:
          type: array
          description: List of delegator stake accounts to fetch the delegator information. A maximum of 250 entries are allowed.
          items:
            type: string
            description: List of delegator stake accounts to fetch the delegator information. A maximum of 250 entries are allowed.
    DelegatorInfoListResponse:
      type: object
      properties:
        network:
          type: string
          description: "Network specified in the request. Supported values;\r\n- mainnet\r\n- testnet\r\n- devnet"
          enum:
          - mainnet
          - testnet
          - devnet
        page:
          type: integer
          description: The current page number sent in the request.
          format: int32
        total:
          type: integer
          description: Total number of stake accounts being sent in the API response
          format: int64
        data:
          type: object
          description: An array that contains the details about stake accounts.
          properties:
            stake_account:
              type: string
              description: "\t\nThe public key of the stake account"
            status:
              type: string
              description: Current status of the delegator
            balance_in_sol:
              type: number
              description: The current balance of the stake account in SOL. Values will be displayed up to 9 decimal places
              format: double
            balance_in_lamports:
              type: number
              description: The balance in the stake account in Lamports
              format: double
            validator_info:
              $ref: '#/components/schemas/ValidatorInfo'
            provision_info:
              $ref: '#/components/schemas/ProvisionInfo'
    ValidatorInfo:
      type: object
      description: JSON object that represents the validator for which the given stake account is attached to.
      properties:
        address:
          type: string
          description: The public key of the validator
    ProvisionInfo:
      type: object
      description: JSON object that contains the registration details of the delegator.
      properties:
        id:
          type: string
          description: The reference number issued when successfully onboarding the stake account
        created_at:
          type: string
          description: Created date and time in the platform. This should be YYYY-MM-DD HH:mm:ss in UTC.
    DelegatorInfoResponse:
      required:
      - network
      type: object
      properties:
        network:
          type: string
          description: The network on which validators should be created. Supported values.
          enum:
          - mainnet
          - testnet
          - devnet
        stake_account:
          type: string
          description: "\t\nThe public key of the stake account"
        status:
          type: string
          description: Current status of the delegator
        balance_in_lamports:
          type: number
          description: The balance in the stake account in Lamports
          format: double
        balance_in_sol:
          type: number
          description: The balance of the stake account in SOL. Values will be displayed up to 9 decimal places
          format: double
        validator_info:
          $ref: '#/components/schemas/ValidatorInfo'
        provision_info:
          $ref: '#/components/schemas/ProvisionInfo'
    SolValidatorInfoResponse:
      type: object
      properties:
        network:
          type: string
          description: "Network specified in the request. Supported values;\r\n- mainnet\r\n- testnet\r\n- devnet"
          enum:
          - mainnet
          - testnet
          - devnet
        apy:
          type: number
          description: The Annualized Percentage Yield of the validator. This value is calculated only using the stake accounts for the specified validator that have been onboarded onto the staking platform. The calculation considers gross rewards earned across the past 10 epochs.
          format: double
        block_rewards_apy:
          type: number
          description: The Annualized Percentage Yield on block rewards earned by the stake accounts under the validator. This value is calculated considering gross block rewards earned across the past 10 epochs.
          format: double
        total_apy:
          type: number
          description: The Annualized Percentage Yield on total rewards earned by the stake accounts under the validator. This value is calculated considering gross rewards earned across the past 10 epochs.
          format: double
        validator_address:
          type: string
          description: The address of the validator for which information is requested.
        validator_status:
          type: string
          description: The current status of the validator
        delegated_balance:
          type: number
          description: The total balance delegated under the validator in SOL. The total "net balance" values of the delegators under the staking platform. Values will be displayed up to 9 decimal places
          format: double
    ValidatorMonitoringRequest:
      type: object
      required:
      - network
      - validator_address
      - delegators
      properties:
        network:
          type: string
          description: "Applicable network. Supported values;\r\n- mainnet\r\n- testnet\r\n- devnet"
          enum:
          - mainnet
          - testnet
          - devnet
        validator_address:
          type: string
          description: The address of the validator under which the stake account is delegating SOL.
        delegators:
          type: array
          description: A list containing the information of the delegator addresses that will be monitored on the staking platform.
          items:
            $ref: '#/components/schemas/Delegators'
    Delegators:
      type: object
      description: A list containing the information of the delegator addresses that will be monitored on the staking platform.
      required:
      - stake_accounts
      - participant
      properties:
        stake_accounts:
          type: array
          description: 'A list of the delegator addresses. A maximum of 250 entries are allowed. '
          items:
            type: string
            description: A list of the delegator addresses
        participant:
          type: string
          description: 'The participant name registered on the staking platform that is associated with the client''s customer. '
        account:
          type: string
          description: The account name registered on the staking platform that is associated with the client's customer. If not provided, requests will be assigned to a default account.
security:
- AuthorizationToken: []
- APIKey: []
tags:
- name: Solana
  description: The Staking API responses will adhere to standard HTTP response conventions. Importantly, the staking platform performs business validations on all POST request messages to ensure that each request contains accurate and complete information. The business validation failures will be responded to with an HTTP 400, while any internal processing errors identified will be responded to with an HTTP 500.
