paths:
  /v1/solana/delegators/stake-account:
    post:
      summary: Stake Account Creation
      description: This endpoint allows clients to initiate staking by creating and funding a new stake account on the Solana blockchain.
      tags:
      - Solana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - network
              - funding_pubkey
              - amount
              properties:
                network:
                  type: string
                  description: "The network on which the stake account should be created. Supported values;\r\n-mainnet\r\n-testnet\r\n-devnet"
                  enum:
                  - mainnet
                  - testnet
                  - devnet
                participant:
                  type: string
                  description: "The participant name registered on the staking platform that corresponds to the client's customer. \r\nIf not provided requests will be assigned to a default participant connected to the API key."
                account:
                  type: string
                  description: "The account name registered on the staking platform that corresponds to the client's customer. \r\nIf not provided requests will be assigned to a default account linked to the participant."
                funding_pubkey:
                  type: string
                  description: The Solana account address that will be funding the stake account.
                amount:
                  type: number
                  description: The amount of SOL that should be sent to the stake account. The minimum stake amount is 0.01 SOL.
                stake_authority_pubkey:
                  type: string
                  description: The Solana account address that should sign all stake account related actions (Delegation, Undelegation, Split and Merge). If not provided will default to the "funding_pubkey".
                withdraw_authority_pubkey:
                  type: string
                  description: The Solana account address that should sign withdrawal transactions. If not provided will default to the "funding_pubkey".
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                type: object
                properties:
                  stake_account_pubkey:
                    type: string
                    description: The public key of the newly created stake account.
                  unsigned_tx:
                    type: string
                    description: The Hexadecimal encoded serialized unsigned transaction which should be signed by the relevant parties specified in the signers field.
                  signers:
                    type: array
                    description: The funding account that has to sign the transaction.
                    items:
                      type: string
                  created_at:
                    type: string
                    format: date-time
                    description: "The time at which the request was received by the staking platform.\r\nTimes will be shown in the \"YYYY-MM-DD HH:mm:ss\" format."
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternalServerErrorMessage'
  /v1/solana/delegators/delegate:
    post:
      summary: Delegation
      description: This end point supports the delegation of stake accounts under a selected validator. Clients can delegate stake accounts that are currently onboarded onto the staking platform as well as stake accounts that do not have a corresponding position on the staking platform i.e. stake accounts created elsewhere.
      tags:
      - Solana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stake_account_pubkey
              - validator_pubkey
              properties:
                stake_account_pubkey:
                  type: string
                  description: The stake account that should be delegated.
                validator_pubkey:
                  type: string
                  description: The validator address under which the stake account should be delegated.
                fee_payer:
                  type: string
                  description: The Solana account address that should pay the fees related to the transaction. If not provided fees should be paid by the Stake Authority of the stake account.
                participant:
                  type: string
                  description: The participant name registered on the staking platform under which the stake account should be created if it has not currently been onboarded onto the staking platform. If not provided the position will be created under a default participant.
                account:
                  type: string
                  description: The account name registered on the staking platform under which the stake account should be created if it has not currently been onboarded onto the staking platform. If not provided the position will be created under a default account.
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                type: object
                properties:
                  stake_account_pubkey:
                    type: string
                    description: The stake account that was sent in the delegation request.
                  validator_pubkey:
                    type: string
                    description: The validator address that was sent in the delegation request.
                  unsigned_tx:
                    type: string
                    description: The Hexadecimal encoded serialized unsigned transaction which should be signed by the relevant parties specified in the signers field.
                  signers:
                    type: array
                    description: An array of the Solana account addresses that should sign the transaction. A delegation request should be signed by the Stake Authority of the stake account and the "fee_payer" (If applicable).
                    items:
                      type: string
                  created_at:
                    type: string
                    format: date-time
                    description: The time at which the request was received by the staking platform. Times will be shown in the "YYYY-MM-DD HH:mm:ss" format.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternalServerErrorMessage'
