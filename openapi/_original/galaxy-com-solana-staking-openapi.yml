                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternalServerErrorMessage'
  /v1/solana/{network}/validators/{validator_address}:
    get:
      tags:
      - Solana
      summary: 'Validator Information '
      description: "Clients can use this endpoint to query detailed information about Solana validators with stake accounts under them on the staking platform.\r\n"
      operationId: getValidatorInfo
      parameters:
