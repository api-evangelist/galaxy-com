  /v1/solana/delegators/split:
    post:
      summary: Split
      description: Clients can use this endpoint to split the balance of a stake account into a new stake account. It supports splitting both onboarded stake accounts and those without a corresponding position on the staking platform.
      tags:
      - Solana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stake_account_pubkey
              - amount
              properties:
                stake_account_pubkey:
                  type: string
                  description: The stake account that should be split.
                amount:
                  type: number
                  description: The amount of SOL that should be split from the existing stake account to the newly created stake account.
                fee_payer:
                  type: string
                  description: The Solana account address that should pay the fees related to the transaction. If not provided fees should be paid by the Stake Authority of the stake account.
                participant:
                  type: string
                  description: The participant name registered on the staking platform under which the stake account should be created if it has not currently been onboarded onto the staking platform. If not provided the position will be created under a default participant.
                account:
                  type: string
                  description: The account name registered on the staking platform under which the stake account should be created if it has not currently been onboarded onto the staking platform. If not provided the position will be created under a default account.
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_account_pubkey:
                    type: string
                    description: The existing stake account that was sent in the split request
                  destination_account_pubkey:
                    type: string
                    description: The newly created stake account to which SOL will be transferred
                  unsigned_tx:
                    type: string
                    description: The Hexadecimal encoded serialized unsigned transaction which should be signed by the relevant parties specified in the signers field.
                  signers:
