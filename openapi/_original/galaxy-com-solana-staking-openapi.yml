        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegatorInfoResponse'
        '400':
          description: Bad Request
          content:
            application/json:
