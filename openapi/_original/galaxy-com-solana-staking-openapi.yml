  /v1/solana/delegators/transfer:
    post:
      summary: Transfer
      description: Clients can use this endpoint to transfer SOL from a Solana account (wallet) to a stake account. This endpoint allows clients to transfer SOL to stake accounts that have been onboarded onto the staking platform as well as to stake accounts that do not have a corresponding position on the staking platform.
      tags:
      - Solana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source_account_pubkey
              - destination_account_pubkey
              - amount
              properties:
                source_account_pubkey:
                  type: string
                  description: The Solana account (wallet) from which SOL will be transferred out of.
                destination_account_pubkey:
                  type: string
                  description: The stake account into which SOL will be transferred.
                amount:
                  type: number
                  description: The amount of SOL to be transferred to the stake account.
                fee_payer:
                  type: string
                  description: The Solana account address that should pay the fees related to the transaction. If not provided fees should be paid by the 'source_account_pubkey'.
                participant:
                  type: string
                  description: The participant name registered on the staking platform under which the stake account should be created if it has not currently been onboarded onto the staking platform. If not provided the position/s will be created under a default participant.
                account:
                  type: string
                  description: The account name registered on the staking platform under which the stake account should be created if it has not currently been onboarded onto the staking platform. If not provided the position/s will be created under a default account.
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                type: object
                properties:
                  from_account_pubkey:
                    type: string
                    description: The Solana account (wallet) from which SOL will be transferred.
                  to_account_pubkey:
                    type: string
                    description: The destination stake account to which SOL will be transferred.
                  unsigned_tx:
                    type: string
                    description: The Hexadecimal encoded serialized unsigned transaction which should be signed by the relevant parties specified in the signers field.
                  signers:
                    type: array
                    items:
                      type: string
                    description: An array of the Solana account addresses that should sign the transaction. A transfer request should be signed by the private key of the source account and the "fee_payer" (If applicable).
                  created_at:
                    type: string
                    format: date-time
                    description: The time at which the request was received by the staking platform. Times will be shown in the "YYYY-MM-DD HH:mm:ss" format.
        '400':
