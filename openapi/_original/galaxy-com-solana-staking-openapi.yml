  /v1/solana/delegators/withdraw:
    post:
      summary: Withdrawals
      description: Clients can use this endpoint to withdraw undelegated SOL from both onboarded stake accounts and those without a corresponding position on the staking platform. Withdrawals can be made from a stake account to a Solana account (wallet) or between stake accounts.
      tags:
      - Solana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stake_account_pubkey
              - amount
              properties:
                stake_account_pubkey:
                  type: string
                  description: The stake account from which SOL should be withdrawn.
                recipient_pubkey:
                  type: string
                  description: The stake account or Solana account (wallet) to which the withdrawn SOL will be transferred. If not provided the withdrawal will be done to the funding account of the stake account.
                amount:
                  type: number
                  description: The amount of SOL that should be withdrawn. The amount should be sent without trailing zeros.
                fee_payer:
                  type: string
                  description: The Solana account address that should pay the fees related to the transaction. If not provided fees should be paid by the Withdraw Authority of the stake account.
                participant:
                  type: string
                  description: The participant name registered on the staking platform under which the stake account should be created if it has not currently been onboarded onto the staking platform. If not provided the position will be created under a default participant.
                account:
                  type: string
                  description: The account name registered on the staking platform under which the stake account should be created if it has not currently been onboarded onto the staking platform. If not provided the position will be created under a default account.
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                type: object
                properties:
                  stake_account_pubkey:
                    type: string
                    description: The stake account that was sent in the withdrawal request.
                  recipient_pubkey:
                    type: string
                    description: The recipient address that was sent in the withdrawal request.
                  amount:
                    type: number
                    description: The amount sent in the withdrawal request.
                  unsigned_tx:
                    type: string
                    description: The Hexadecimal encoded serialized unsigned transaction which should be signed by the relevant parties specified in the signers field.
                  signers:
                    type: array
                    description: An array of the Solana account addresses that should sign the transaction. A withdrawal request should be signed by the Withdraw Authority of the stake account and the "fee_payer" (If applicable).
                    items:
