  /v1/solana/delegators/rewards:
    post:
      tags:
      - Solana
      summary: Rewards
      description: The rewards endpoint returns  rewards accrued by a stake account. This endpoint accepts the filtering by start and end (can be epoch or date), and delegator address (stake account) public keys. This endpoint returns the rewards since stake account inception, accrued rewards in the specified period and epoch-wise rewards breakdown for the specified period.
      operationId: getSOLDelegatorAccruedRewards
      parameters:
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: The current page number requested by the client, if not specified, should be defaulted to 1.
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: The number of entries per page, if not presented in the request, should be defaulted to the maximum value of 250.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SOLDelegatorRewardsRequest'
        required: true
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
