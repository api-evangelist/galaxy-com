  /v1/solana/delegators/signed-transaction:
    post:
      summary: Submit Signed Transactions
      description: Clients can submit their signed transactions to the staking platform via this endpoint. Upon receiving a signed transaction the staking platform will broadcast it to the Solana blockchain for execution.
      tags:
      - Solana
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - stake_account_pubkey
              - action
              - tx_payload
              properties:
                stake_account_pubkey:
                  type: string
                  description: The address for which the signed transaction is being sent.
                action:
                  type: string
                  description: "The action for which the payload is applicable. Supported values are;\r\n- stake_account_creation \r\n- delegate \r\n- undelegate\r\n- withdraw\r\n- split\r\n- merge\r\n- transfer"
                  enum:
                  - stake_account_creation
                  - delegate
                  - undelegate
                  - withdraw
                  - split
                  - merge
                  - transfer
                tx_payload:
                  type: string
                  description: Hexadecimal encoded serialized signed transaction corresponding to the  unsigned transaction created via respective endpoint.
                destination_account_pubkey:
                  type: string
                  description: "The destination address for which the signed transaction is being sent. \r\nWill be required if the action is one of the following - withdraw, split, merge, transfer."
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                type: object
                properties:
                  stake_account_pubkey:
                    type: string
                    description: The stake account address in the API request.
                  destination_account_pubkey:
                    type: string
                    description: The destination address in the API request.
                  action:
                    type: string
                    description: The action sent in the request.
                  tx_hash:
                    type: string
                    description: The transaction hash for the broadcasted transaction. The transaction hash will be received after the payload is successfully sent to the Solana blockchain.
                  tx_status:
                    type: string
                    description: "The status of the transaction. Supported values are;\r\n- signed_tx_received\r\n- signed_tx_sent\r\n- broadcasted\r\n- confirmed\r\n- rejected"
                    enum:
                    - signed_tx_received
                    - signed_tx_sent
                    - broadcasted
                    - confirmed
                    - rejected
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternalServerErrorMessage'
