          type: integer
          description: The most recent epoch successfully monitored for the validator, regardless of whether a validator record was persisted. Not applicable from staking initiation until the validator becomes active unless an epoch record exists for the last monitored epoch. Epoch records are created only when there is a balance, status, or reward update for that epoch.
          format: int32
        epoch:
          type: integer
          description: The specific blockchain epoch to which the returned validator details correspond.
          format: int32
        status:
          type: string
          description: Current status of the validator.
          enum:
          - STAKING_INITIATED
          - PENDING_DEPOSIT
          - DEPOSITED
          - DEPOSIT_FAILED
          - PENDING_QUEUED
          - ACTIVE
          - SLASHING
          - SLASHED
          - EXIT_INITIATED
          - EXITING
          - EXITED
          - WITHDRAWABLE
          - WITHDRAWN
        pubkey:
          type: string
          description: Public key of the validator.
        region:
          type: string
          description: The geographic region where the validator will be created.
          enum:
          - US
          - EU
          - KR
        validator_index:
          type: integer
          description: Validator index.
          format: int32
