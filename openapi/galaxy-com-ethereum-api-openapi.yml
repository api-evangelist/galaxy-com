          type: string
          description: 'Withdrawal address of the corresponding validator. '
        fee_recipient_address:
          type: string
          description: The fee recipient address belongs to the validator.
        estimated_activation_at:
          type: string
          description: Estimate of when the validator will become active and start earning rewards. This will be populated since the validator is transitioned to DEPOSITED status. Until then, it will be null. It will be in the format of “YYYY-MM-DD HH:mm:ss”.
        estimated_exit_at:
          type: string
          description: Estimate of when the validator will exit and stop earning rewards. This will be populated since the validator is transitioned to EXIT_INITIATED status. Until then, it will be null. It will be in the format of “YYYY-MM-DD HH:mm:ss”.
        estimated_withdrawal_at:
          type: string
