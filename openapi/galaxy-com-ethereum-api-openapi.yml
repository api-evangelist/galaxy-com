openapi: 3.2.0
info:
  title: Specification Ethereum API
  version: 1.120.0
  x-assembled-from:
    note: 'Merged verbatim from the OpenAPI fragments GitBook embeds in the provider docs markdown twins; the published fragments declare only servers: http://localhost (Generated server url), and the docs state no production base URL, so servers is omitted.'
    sources:
    - https://docs.staking.galaxy.com/ethereum/ethereum.md
    - https://docs.staking.galaxy.com/ethereum/models.md
    retrieved: '2026-10-14'
security:
- AuthorizationToken: []
- APIKey: []
tags:
- name: Ethereum
paths:
  /v1/ethereum/validators:
    post:
      tags:
      - Ethereum
      summary: Provision Validators
      description: The staking endpoint must be invoked by the client to facilitate the staking action. When a request to provision more than 100 validators is received, it will be split into batches, each containing a maximum of 100 validators, and then processed. A total of 1,000 validators can be provisioned per request, across 10 batches.
      operationId: validators
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StakingRequest'
        required: true
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerStakingErrorListResponse'
  /v1/ethereum/validators/exit:
    post:
      tags:
      - Ethereum
      summary: Exit Validators
      description: 'The exit endpoint enables clients to initiate validator withdrawals by broadcasting voluntary exit messages to the beacon chain. It can be enabled in three ways.

        - **Validator Public Keys**: Exit from the network using the specified validator public addresses.

        - **Validator Indexes**: Exit from the network using the specified validator indexes.

        - **Withdrawal Address with Validator Count**: Exit from the network using the specified withdrawal address and validator count. Only type 0x01 validators can be exited using this method.


        Each request type can handle exiting only up to 250 validators at once.'
      operationId: exit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatorExitRequest'
        required: true
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorExitResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerStakingErrorListResponse'
  /v1/ethereum/validators/exit/pre-signed:
    post:
      tags:
      - Ethereum
      summary: Derive Pre-Signed Exit Message
      description: 'The pre-signed exit endpoint enables clients to request pre-signed exit messages for validators. When clients decide to exit their validators, the pre-signed exit message can be independently broadcasted to the consensus node. The validators must be in an active state for at-least 256 epochs in order to derive the encrypted pre-signed exit message.


        Before calling this endpoint, the client must create an RSA4096 key pair.This is a separate key pair from the one used for JWT signature generation.The client needs to share the public key from this new key pair with the platform. The platform will use this public key to encrypt the pre-signed exit message with the RSA_OAEP_SHA_256 algorithm.'
      operationId: pre-signed
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatorExitRequest'
        required: true
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorPreSignedExitResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerStakingErrorListResponse'
  /v1/ethereum/{network}/validators:
    get:
      tags:
      - Ethereum
      summary: Get All Validators or by Staking Reference ID
      description: The get all validators endpoint returns the details of the validators provisioned for the given client for the specified network in a paginated manner. This endpoint can also be used to return the details of the validators belonging to the given client for the specified network and staking reference ID. All timestamp fields in the response are provided in UTC timezone.
      operationId: get-validators
      parameters:
      - name: network
        in: path
        description: Applicable values are mainnet and hoodi
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: The current page number requested by the client, if not specified, should be defaulted to 1.
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: The number of entries per page, if not presented in the request, should be defaulted to the maximum value of 250.
        required: false
        schema:
          type: string
      - name: staking_ref_id
        in: query
        description: The staking reference ID returned for the staking request.
        required: false
        schema:
          type: string
      - name: include_presigned_exit
        in: query
        description: This indicates whether the pre-signed exit message to be included in the response or not. It’s a boolean parameter, defaulted to "false".
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorsInfoResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerInfoErrorMessage'
  /v1/ethereum/{network}/validators/{pubkey}:
    get:
      tags:
      - Ethereum
      summary: Get a Single Validator
      description: The get single validator endpoint returns the validator information for the specified validator’s public key. All timestamp fields in the response are provided in UTC timezone.
      operationId: get-validator
      parameters:
      - name: network
        in: path
        description: Applicable values are mainnet and hoodi.
        required: true
        schema:
          type: string
      - name: pubkey
        in: path
        description: The public key of the validator
        required: true
        schema:
          type: string
      - name: include_presigned_exit
        in: query
        description: This indicates whether the pre-signed exit message to be included in the response or not. It’s a boolean parameter, defaulted to “false”.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorInfoResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerInfoErrorMessage'
  /v1/ethereum/{network}/validators/summary:
    get:
      tags:
      - Ethereum
      summary: Get Validators Summary
      description: This endpoint returns the summary of the validator count by status belonging to the staking partner associated with the given API Key.
      operationId: validators-summary
      parameters:
      - name: network
        in: path
        description: Applicable values are mainnet and hoodi.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorsSummaryResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerInfoErrorMessage'
  /v1/ethereum/validators/withdrawals:
    post:
      tags:
      - Ethereum
      summary: Withdrawals
      description: The withdrawals endpoint returns a history of withdrawals (partial and full) from the consensus layer to the execution layer.
      operationId: withdrawals
      parameters:
      - name: page
        in: query
        description: The current page number requested by the client, if not specified, should be defaulted to 1.
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: The number of entries per page, if not presented in the request, should be defaulted to the maximum value of 250.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EthEpochLevelInfoRequest'
        required: true
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EthEpochLevelInfoResponseWithWithdrawalSlotInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerInfoErrorMessage'
  /v1/ethereum/validators/rewards:
    post:
      tags:
      - Ethereum
      summary: Rewards
      description: The rewards endpoint returns accrued rewards on the execution and consensus layers. Rewards can be queried using either an epoch range or a date range, with results returned at the corresponding epoch level. This endpoint returns rewards for validators created via the Provision Validators endpoint as well as validators registered for monitoring. Positive values represent rewards, while negative values represent penalties.
      operationId: rewards
      parameters:
      - name: page
        in: query
        description: The current page number requested by the client, if not specified, should be defaulted to 1.
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: The number of entries per page, if not presented in the request, should be defaulted to the maximum value of 250.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EthEpochLevelInfoRequest'
        required: true
      responses:
        '200':
          description: Sample success response payload. See Response schema below for wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EthEpochLevelInfoResponseWithValidatorData'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerInfoErrorMessage'
  /v1/ethereum/validators/consolidate:
    post:
      summary: Consolidate Validators
      tags:
      - Ethereum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerStakingErrorListResponse'
      operationId: consolidate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsolidateRequest'
      description: 'The consolidate endpoint enables clients to perform the following actions:

        - Convert withdrawal credential type 0x01 validators to the 0x02 type.

        - Consolidate a type 0x01 or 0x02 validator with a type 0x02 validator by adding the balance of the former to the latter while exiting the former.'
  /v1/ethereum/validators/el-triggerable-exit:
    post:
      summary: Exit Validators via the Execution Layer
      tags:
      - Ethereum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ELExitResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerStakingErrorListResponse'
      operationId: el-triggerable-exit
      description: The execution-layer triggerable exit endpoint enables clients to initiate validator exits directly via the validator’s withdrawal address. This functionality is applicable to both withdrawal credential type 0x01 and 0x02 validators.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ELExitRequest'
  /v1/ethereum/validators/el-triggerable-withdrawal:
    post:
      summary: Partially Withdraw Validator Balances via the Execution Layer
      tags:
      - Ethereum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ELWithdrawalResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerStakingErrorListResponse'
      operationId: el-triggerable-withdrawal
      description: 'For validators with withdrawal credential type 0x01, any balance in excess of 32 ETH is automatically swept to the validator’s withdrawal address by the protocol. In contrast, 0x02 validators do not support automatic sweeping. Instead, clients can initiate partial withdrawals via the API.


        The partial withdrawal amount is computed as the lesser of:

        - the user-specified withdrawal amount, and

        - (current balance − 32 ETH − pending withdrawals)


        This ensures that the maximum amount that can be withdrawn from a 0x02 validator is limited to the validator''s effective balance in excess of 32 ETH, excluding any amounts already pending withdrawal.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ELWithdrawalRequest'
  /v1/ethereum/validators/topup:
    post:
      summary: Top Up Validators
      tags:
      - Ethereum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerStakingErrorListResponse'
      operationId: topup
      description: 'The top-up endpoint allows staking partners to add additional ETH to existing validators with withdrawal credential type 0x01 or 0x02. At this point Galaxy does not support batch top ups.

        - **0x01 validators:** The valid top up amount must be between 1 ETH and the amount required to reach a total balance of 32 ETH.

        - **0x02 validators:** The valid top up amount must be between 1 ETH and the amount required to reach a total balance of 2048 ETH.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpRequest'
  /v1/ethereum/validators/fee:
    post:
      summary: Get Fees
      tags:
      - Ethereum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerInfoErrorMessage'
      operationId: fee
      description: 'The get fees endpoint allows clients to retrieve the current fee applicable to the following actions on existing validators:

        - Consolidation or conversion

        - Execution-layer triggerable exits or partial withdrawals


        Fees are dynamic and vary based on the number of pending requests in the corresponding processing queue. It is recommended to call this endpoint before submitting a request to ensure awareness of the applicable fee.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeRequest'
  /v1/ethereum/validators/deposit-data:
    get:
      summary: Get Deposit Data
      tags:
      - Ethereum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositDataResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositDataErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerStakingErrorListResponse'
      operationId: deposit-data
      description: The deposit data endpoint facilitates the retrieval of the Provision Validators endpoint’s response, which contains the deposit data, using the Client Request ID of the original request.
      parameters:
      - schema:
          type: string
        in: query
        name: client_req_id
        description: The Client Request ID applicable to the Provision Validators request for which deposit data is required.
  /v1/ethereum/validators/update-fee-recipient:
    post:
      summary: Update Fee Recipient Address
      tags:
      - Ethereum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFeeRecipientResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerStakingErrorListResponse'
      operationId: update-fee-recipient
      description: The update fee recipient address endpoint allows clients to update their validators’ fee recipient address and direct execution-layer rewards to a new wallet.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFeeRecipientRequest'
  /v1/ethereum/validators/monitoring:
    post:
      summary: Validator Monitoring
      tags:
      - Ethereum
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorMonitoringResponse'
          headers:
            header-0:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatorErrorListResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerInfoErrorMessage'
      operationId: monitoring
      description: 'Clients can invoke this endpoint to monitor existing validators by retrieving and tracking validator addresses on the platform. A request with a list of validator addresses enables the creation of corresponding positions on the platform for monitoring.


        If an onboarded validator has a long history to catch up on, it will take some time for the validator to become up to date with the current epoch, status, balances, and rewards. When performing any staking actions on such validators, this must be taken into account.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidatorMonitoringRequest'
components:
  schemas:
    ExecutionReward:
      type: object
      properties:
        type:
          type: string
          description: Type of rewards.
          enum:
          - EXECUTION
        rewards_eth:
          type: number
          format: double
          description: 'Execution layer rewards accumulated during the period in ETH. Note: If the MEV information is not yet available, this field will be set to null. The value will be updated once the MEV information becomes available.'
        rewards_wei:
          type: string
          description: 'Execution layer rewards accumulated during the period in WEI. Note: If the MEV information is not yet available, this field will be set to null. The value will be updated once the MEV information becomes available.'
        is_mev:
          type: boolean
          description: When the MEV boost was used for the block proposal, this should be set to true; otherwise it will be false. This field will also be set to ‘false’ if the MEV information is not yet available. In a scenario like this, the rewards_eth and rewards_wei values will be set to null. The values will be updated once the MEV information becomes available.
        mev_relay:
          type:
          - string
          - 'null'
          description: The name of the MEV boost service. Applicable only if is_mev is true; otherwise, it will be null. This field will also be set to null if the MEV information is not yet available. The value will be updated once the MEV information becomes available.
        recipient:
          type: string
          description: The recipient address of the execution rewards. This field will be set to null if the MEV information has not yet been received from the relay. The value will be updated once the MEV information becomes available.
        mev_builder:
          type:
          - string
          - 'null'
          description: The public key of the MEV builder that sent the execution rewards. Applicable only if is_mev is true; otherwise, it will be null. This field will also be set to null if the MEV information is not yet available. The value will be updated once the MEV information becomes available.
        slot:
          type: integer
          description: The slot number of the proposal made by the validator.
          format: int32
        block:
          type: integer
          description: The execution layer block number of the proposal made by the validator.
          format: int64
        tx_hash:
          type:
          - string
          - 'null'
          description: The hash of the transaction used to send the MEV rewards. Applicable only if is_mev is true; otherwise, it will be null. This field will also be set to null if the MEV information is not yet available. The value will be updated once the MEV information becomes available.
    StakingErrorListResponse:
      title: Error List
      type: object
      properties:
        client_req_id:
          type: string
          description: The client_req_id of the request addressed by this response message.
        errors:
          type: array
          description: An array of errors that resulted from this request.
          items:
            $ref: '#/components/schemas/ErrorMessage'
    DepositTransaction:
      title: Staking Response Batch Deposit Transaction
      type: object
      description: The JSON object that contains the funding transaction details of all validators belonging to this batch.
      properties:
        deposit_amount_wei:
          type: string
          description: The total amount of ETH to be staked for the batch in WEI.
        deposit_address:
          type: string
          description: Batch deposit contract address.
        contract_call_data:
          type: string
          description: 'Encoded function call data to be broadcasted to the Batch Deposit Contract. '
    DepositData:
      title: Staking Response Batch Deposit Data
      type: object
      description: An array of validator details in this batch.
      properties:
        pubkey:
          type: string
          description: Public key of the validator.
        amount:
          type: number
          description: The amount of ETH in GWEI required to be deposited.
          format: double
        withdrawal_credentials:
          type: string
          description: Withdrawal credentials for the validator funds to be withdrawn upon exit.
        signature:
          type: string
          description: A “proof of possession” which signs over pubkey, withdrawal_credentials, and amount using the validator private key.
        deposit_data_root:
          type: string
          description: Merkle root hash of the deposit data.
        deposit_message_root:
          type: string
          description: Merkle root hash of the deposit message.
        fork_version:
          type: string
          description: The genesis fork version.
        deposit_cli_version:
          type: string
          description: Staking deposit cli version.
    InternalServerInfoErrorMessage:
      title: Error Message
      type: object
      description: An array of errors that resulted from this request.
      required:
      - message
      properties:
        message:
          type: string
          description: The description related to the error being reported.
    ConsensusReward:
      type: object
      properties:
        type:
          type: string
          description: Type of rewards.
          enum:
          - CONSENSUS
        rewards_eth:
          type: number
          format: double
          description: Consensus layer rewards accumulated during the period in ETH.
        rewards_wei:
          type: string
          description: Consensus layer rewards accumulated during the period in WEI.
        attestation_rewards_eth:
          type: number
          format: double
          description: Total rewards earned from attestation duties during the period, expressed in ETH. This field is only applicable for consensus layer rewards. Returned only when cl_rewards_breakdown is true.
        attestation_rewards_wei:
          type: string
          description: Total rewards earned from attestation duties during the period, expressed in WEI. This field is only applicable for consensus layer rewards. Returned only when cl_rewards_breakdown is true.
        block_proposer_rewards_eth:
          type: number
          format: double
          description: Total rewards earned from block proposal duties during the period, expressed in ETH. This field is only applicable for consensus layer rewards. Returned only when cl_rewards_breakdown is true.
        block_proposer_rewards_wei:
          type: string
          description: Total rewards earned from block proposal duties during the period, expressed in WEI. Returned only when cl_rewards_breakdown is true.
        sync_committee_rewards_eth:
          type: number
          format: double
          description: Total rewards earned from sync committee duties during the period, expressed in ETH. Returned only when cl_rewards_breakdown is true.
        sync_committee_rewards_wei:
          type: string
          description: Total rewards earned from sync committee duties during the period, expressed in WEI. Returned only when cl_rewards_breakdown is true.
        initial_slashing_penalties_eth:
          type: number
          format: double
          description: Initial slashing penalties incurred during the period, expressed in ETH. Returned only when cl_rewards_breakdown is true.
        initial_slashing_penalties_wei:
          type: string
          description: Initial slashing penalties incurred during the period, expressed in WEI. Returned only when cl_rewards_breakdown is true.
        correlation_slashing_penalties_eth:
          type: number
          format: double
          description: Correlation slashing penalties incurred during the period, expressed in ETH. Returned only when cl_rewards_breakdown is true.
        correlation_slashing_penalties_wei:
          type: string
          description: Correlation slashing penalties incurred during the period, expressed in WEI. Returned only when cl_rewards_breakdown is true.
    RewardsBreakdown:
